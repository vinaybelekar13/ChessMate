## OPTIONAL — production/Postgres path only. Local development does NOT
## need Docker or this file at all: default DATABASE_URL is SQLite, so
## `pip install -r requirements.txt && uvicorn app.main:app` is enough.
## See README.md "Local development (no Docker)".
version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bookcoach
      POSTGRES_PASSWORD: bookcoach
      POSTGRES_DB: bookcoach
    ports:
      - "5432:5432"
    volumes:
      - bookcoach_pg_data:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - ./storage:/app/storage

volumes:
  bookcoach_pg_data:
